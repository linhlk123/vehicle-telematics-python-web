version: '3.8'

services:
  telematics-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telematics-app
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
